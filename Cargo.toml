[package]
name = "my-egui-app"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34"
egui = "0.34"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
cargo-packager-resource-resolver = "0.1.2"

[profile.release]
opt-level = "z"      # 优化体积
lto = true           # 链接时优化
codegen-units = 1    # 单一编译单元，提升优化效果
panic = "abort"      #  panic 时直接终止，减小编译产物
strip = true         # 移除符号信息

[package.metadata.packager]
product-name = "my-egui-app"
before-packaging-command = "cargo build --release"
authors = ["Nyevo"]
identifier = "com.example.nyevo"
copyright = "Copyright © 2025 Nyevo"
